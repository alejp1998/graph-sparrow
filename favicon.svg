<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sparrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sparrowGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Origami / Geometric Sparrow in Flight with Node Vertices -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wing & Body Triangles -->
    <polygon points="32,16 48,28 32,38 16,28" fill="rgba(255,255,255,0.15)"/>
    <polygon points="32,38 42,50 32,46 22,50" fill="rgba(6,182,212,0.25)" stroke="#38BDF8"/>
    <polygon points="32,16 48,28 44,12" fill="rgba(16,185,129,0.25)" stroke="#34D399"/>
    <!-- Head & Beak -->
    <polygon points="48,28 54,26 48,32" fill="#FBBF24" stroke="#F59E0B"/>
  </g>
  <!-- Graph Node Vertices -->
  <circle cx="32" cy="16" r="3.5" fill="#34D399"/>
  <circle cx="48" cy="28" r="3.5" fill="#F59E0B"/>
  <circle cx="32" cy="38" r="3.5" fill="#38BDF8"/>
  <circle cx="16" cy="28" r="3.5" fill="#A78BFA"/>
  <circle cx="32" cy="46" r="2.5" fill="#38BDF8"/>
</svg>
