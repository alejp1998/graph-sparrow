<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sparrowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sparrowBg)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Origami Sparrow in Flight with Node Graph Vertices -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wing & Body -->
    <path d="M 12 36 C 22 26 30 16 42 12 C 48 10 54 12 54 12 C 54 12 54 18 50 24 C 42 32 30 38 20 40" fill="rgba(255,255,255,0.18)" stroke="#FFFFFF"/>
    <!-- Tail Feather -->
    <path d="M 20 40 L 12 52 L 26 44" fill="rgba(6,182,212,0.3)" stroke="#38BDF8"/>
    <!-- Beak -->
    <polygon points="54,12 60,11 54,16" fill="#FBBF24" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
  <!-- Graph Node Vertices -->
  <circle cx="42" cy="12" r="3.5" fill="#34D399"/>
  <circle cx="34" cy="22" r="3" fill="#FBBF24"/>
  <circle cx="20" cy="40" r="3" fill="#38BDF8"/>
</svg>
